name: Release RabbitMQ AMQP JMS Client

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          server-id: central-portal
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Release RabbitMQ AMQP JMS Client
        run:  |
          git config user.name "rabbitmq-ci"
          git config user.email "rabbitmq-ci@users.noreply.github.com"
          ci/release.sh
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Publish documentation for the release
        run: |
          source ./release-versions.txt
          git checkout --detach "v$RELEASE_VERSION"
          ci/publish-documentation-to-github-pages.sh
      - name: Request GitHub Pages build
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
